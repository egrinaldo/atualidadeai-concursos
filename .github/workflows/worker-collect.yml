# Robô de coleta + triagem + agrupamento + verificação + análise por IA + auditoria de veracidade + revisão automática: a cada 3 horas (minuto 7, fora do horário de pico do agendador).
# Cada rodada é idempotente por janela de 3h (dedupe_key), então reexecuções não duplicam.
name: worker-collect
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run job -- tick collect,triage,cluster,verify,analyze,audit,review
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Sem a chave, análise e auditoria são ignoradas (as demais seguem normalmente)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
