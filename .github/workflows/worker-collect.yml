# Robô de coleta + triagem + agrupamento + verificação + análise por IA + auditoria de veracidade + revisão automática: a cada 3 horas (minuto 7, fora do horário de pico do agendador).
# Cada rodada é idempotente por janela de 3h (dedupe_key), então reexecuções não duplicam.
name: worker-collect
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run job -- tick collect,triage,cluster,verify,analyze,audit,review,deliver@reforco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Sem a chave, análise e auditoria são ignoradas (as demais seguem normalmente)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # deliver@reforco: rede de segurança do envio das 06h (idempotente; antes das 06h não faz nada)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_TEST_TO: ${{ secrets.EMAIL_TEST_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
